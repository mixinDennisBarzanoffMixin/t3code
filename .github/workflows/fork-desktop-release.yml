name: Fork desktop release

# Controlled fleet builds. Nothing here runs on push or on an upstream timer:
# a maintainer deliberately chooses when a reviewed commit becomes a release.
on:
  workflow_dispatch:
    inputs:
      release_notes:
        description: Optional note describing why this fleet build is being cut
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: fork-desktop-release
  cancel-in-progress: false

env:
  # These are the public identifiers from .env.example, not credentials.
  T3CODE_CLERK_PUBLISHABLE_KEY: pk_live_Y2xlcmsudDMuY29kZXMk
  T3CODE_CLERK_JWT_TEMPLATE: t3-relay
  T3CODE_CLERK_CLI_OAUTH_CLIENT_ID: hzxSgY2cH10sDU2r
  T3CODE_RELAY_URL: https://relay.t3.codes

jobs:
  metadata:
    name: Resolve fleet preview version
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      version: ${{ steps.meta.outputs.version }}
      tag: ${{ steps.meta.outputs.tag }}
      ref: ${{ steps.meta.outputs.ref }}
      short_sha: ${{ steps.meta.outputs.short_sha }}
    steps:
      - name: Checkout selected commit
        uses: actions/checkout@v6
        with:
          fetch-depth: 1

      - id: meta
        name: Generate non-updating preview version
        shell: bash
        run: |
          set -euo pipefail
          base_version="$(node -p "require('./apps/desktop/package.json').version.split('-')[0]")"
          stamp="$(date -u +%Y%m%d)"
          build_id="${GITHUB_RUN_ID}${GITHUB_RUN_ATTEMPT}"
          version="${base_version}-preview.${stamp}.${build_id}"
          short_sha="$(git rev-parse --short=9 HEAD)"
          {
            echo "version=$version"
            echo "tag=fork-desktop-v$version"
            echo "ref=$GITHUB_SHA"
            echo "short_sha=$short_sha"
          } >> "$GITHUB_OUTPUT"
          {
            echo "### Fork desktop build"
            echo
            echo "- Version: \`$version\`"
            echo "- Source: \`$short_sha\`"
            echo "- Automatic updater metadata: disabled"
          } >> "$GITHUB_STEP_SUMMARY"

  build_bundle:
    name: Build shared desktop bundle
    needs: metadata
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout selected commit
        uses: actions/checkout@v6
        with:
          ref: ${{ needs.metadata.outputs.ref }}
          sparse-checkout: |
            /*
            !/.repos/
          sparse-checkout-cone-mode: false

      - name: Setup Vite+
        uses: voidzero-dev/setup-vp@250f29ce396baf5e8f24498e17c0dfdebabc26eb # v1
        with:
          node-version-file: package.json
          cache: true
          run-install: false

      - name: Install bundle dependencies
        run: vp install --filter=t3... --filter=@t3tools/web... --filter=@t3tools/desktop... --filter=@t3tools/scripts...

      - name: Install browser-secret build libraries
        run: sudo apt-get update && sudo apt-get install -y libsecret-1-dev pkg-config

      - name: Align package versions
        run: node scripts/update-release-package-versions.ts "${{ needs.metadata.outputs.version }}"

      - name: Run fleet regression tests
        run: |
          vp test run apps/desktop/src/ssh/DesktopSshPasswordPrompts.test.ts packages/ssh/src/tunnel.test.ts
          vp test run scripts/build-desktop-artifact.test.ts -t "ad-hoc signs unsigned macOS builds"

      - name: Build desktop bundle
        run: vp run build:desktop

      - name: Upload shared bundle
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: js-bundle
          path: |
            apps/server/dist
            apps/desktop/dist-electron
          if-no-files-found: error
          retention-days: 2

  mac_arm64:
    name: Package macOS arm64
    needs: [metadata, build_bundle]
    uses: ./.github/workflows/release-desktop.yml
    with:
      version: ${{ needs.metadata.outputs.version }}
      ref: ${{ needs.metadata.outputs.ref }}
      release_channel: preview
      clerk_publishable_key: pk_live_Y2xlcmsudDMuY29kZXMk
      clerk_jwt_template: t3-relay
      clerk_cli_oauth_client_id: hzxSgY2cH10sDU2r
      relay_url: https://relay.t3.codes
      relay_client_tracing: false
      label: macOS arm64 fleet preview
      runner: macos-15
      platform: mac
      target: dmg
      arch: arm64
      rust_target: aarch64-apple-darwin
      resource_key: darwin-arm64
      cli_archive: false

  linux_x64:
    name: Build Linux runtime for Windows WSL
    needs: [metadata, build_bundle]
    uses: ./.github/workflows/release-desktop.yml
    with:
      version: ${{ needs.metadata.outputs.version }}
      ref: ${{ needs.metadata.outputs.ref }}
      release_channel: preview
      clerk_publishable_key: pk_live_Y2xlcmsudDMuY29kZXMk
      clerk_jwt_template: t3-relay
      clerk_cli_oauth_client_id: hzxSgY2cH10sDU2r
      relay_url: https://relay.t3.codes
      relay_client_tracing: false
      label: Linux x64 fleet runtime
      runner: ubuntu-24.04
      platform: linux
      target: AppImage
      arch: x64
      rust_target: x86_64-unknown-linux-gnu
      resource_key: linux-x64
      cli_archive: true

  windows_x64:
    name: Package Windows x64
    needs: [metadata, build_bundle, linux_x64]
    uses: ./.github/workflows/release-desktop.yml
    with:
      version: ${{ needs.metadata.outputs.version }}
      ref: ${{ needs.metadata.outputs.ref }}
      release_channel: preview
      clerk_publishable_key: pk_live_Y2xlcmsudDMuY29kZXMk
      clerk_jwt_template: t3-relay
      clerk_cli_oauth_client_id: hzxSgY2cH10sDU2r
      relay_url: https://relay.t3.codes
      relay_client_tracing: false
      label: Windows x64 fleet preview
      runner: windows-2025
      platform: win
      target: nsis
      arch: x64
      rust_target: x86_64-pc-windows-msvc
      resource_key: win32-x64
      cli_archive: false

  publish:
    name: Publish fork prerelease
    needs: [metadata, mac_arm64, linux_x64, windows_x64]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Download desktop artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          pattern: desktop-*
          merge-multiple: true
          path: release-assets

      - name: Publish GitHub prerelease
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.metadata.outputs.tag }}
          VERSION: ${{ needs.metadata.outputs.version }}
          SHORT_SHA: ${{ needs.metadata.outputs.short_sha }}
          USER_NOTES: ${{ inputs.release_notes }}
        run: |
          set -euo pipefail
          mapfile -d '' assets < <(find release-assets -maxdepth 1 -type f \( -name '*.dmg' -o -name '*.zip' -o -name '*.exe' -o -name '*.AppImage' \) -print0)
          if (( ${#assets[@]} == 0 )); then
            echo "No desktop release assets were downloaded." >&2
            exit 1
          fi

          notes="$RUNNER_TEMP/release-notes.md"
          {
            echo "Controlled T3 Code fleet preview built from \`$SHORT_SHA\`."
            echo
            if [[ -n "$USER_NOTES" ]]; then
              echo "$USER_NOTES"
              echo
            fi
            echo "This preview intentionally has no automatic-update feed. Install future fleet builds manually after they have been reviewed."
            echo
            echo "macOS is ad-hoc signed rather than Apple-notarized; Gatekeeper may require a one-time approval. Windows is unsigned and may show an Unknown Publisher warning."
          } > "$notes"

          gh release create "$TAG" "${assets[@]}" \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "T3 Code fleet preview $VERSION" \
            --notes-file "$notes" \
            --prerelease \
            --latest=false
